{% extends 'base.html' %}

{% block title %}Page Not Found (404) - {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
  <div class="col-md-6">
    <i class="bi bi-question-circle text-warning fs-1"></i>
    <h2 class="fw-bold mt-3">404 - Not Found</h2>
    <p class="text-muted">The requested page or record could not be found.</p>
    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary px-4">Back to Dashboard</a>
  </div>
</div>
{% endblock %}
