{% extends 'base.html' %}

{% block title %}Server Error (500) - {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
  <div class="col-md-6">
    <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
    <h2 class="fw-bold mt-3">500 - Internal Server Error</h2>
    <p class="text-muted">An unexpected server error occurred. Changes have been rolled back safely.</p>
    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary px-4">Back to Dashboard</a>
  </div>
</div>
{% endblock %}
