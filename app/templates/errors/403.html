{% extends 'base.html' %}

{% block title %}Access Denied (403) - {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
  <div class="col-md-6">
    <i class="bi bi-shield-x text-danger fs-1"></i>
    <h2 class="fw-bold mt-3">403 - Forbidden</h2>
    <p class="text-muted">You do not have permission to view or modify this resource.</p>
    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary px-4">Back to Dashboard</a>
  </div>
</div>
{% endblock %}
